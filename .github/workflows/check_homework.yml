name: Check Homework

on:
  pull_request:
    branches:
      - main # Или другая ветка, куда студенты делают PR

jobs:
  check_code:
    runs-on: ubuntu-latest # Используем виртуальную машину Ubuntu
    steps:
      - name: Checkout code
        uses: actions/checkout@v3 # Выгружаем код репозитория

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9' # Укажите нужную версию Python

      - name: Install dependencies
        run: |
          pip install -r requirements.txt # Установка зависимостей (если есть)

      - name: Run homework checker
        id: run-homework-checker
        run: |
          python homework_checker.py # Выполняем ваш скрипт проверки
        
      - name: Add comment to pull request
        uses: actions/github-script@v6
        if: ${{ github.event_name == 'pull_request' }}
        with:
          script: |
            const output = `${{ steps.run-homework-checker.outputs.stdout }}`
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })
